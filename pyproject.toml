[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "josly"
version = "0.2.1"
description = "Typed local JSON documents, portable schemas and property queries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/Cohesian/josly"
Documentation = "https://github.com/Cohesian/josly/blob/main/README.md"
Issues = "https://github.com/Cohesian/josly/issues"

[project.scripts]
josly = "josly.cli:main"

[tool.setuptools]
packages = ["josly"]
package-dir = { josly = "." }

[tool.setuptools.package-data]
josly = ["AGENTS.md", "README.md", "CHANGELOG.md", "docs/*.md", "examples/schemas/*.jsl", "examples/*.json"]
